<div class="card student-card" appHighlight>
  <div class="card-header">
    <div class="avatar">{{ student.name.charAt(0) }}</div>
    <div>
      <h3 class="student-name">{{ student.name | uppercase }}</h3>
      <span class="department-tag">{{ student.department }}</span>
    </div>
    <span class="badge" [ngClass]="student.status === 'Active' ? 'badge-active' : 'badge-inactive'">
      {{ student.status }}
    </span>
  </div>

  <div class="card-body">
    <p class="info-row">
      <span class="info-label">Email:</span>
      <span class="info-val">{{ student.email | lowercase }}</span>
    </p>
    <p class="info-row">
      <span class="info-label">GPA:</span>
      <span class="info-val" [ngStyle]="{'color': student.gpa >= 3.8 ? '#34d399' : '#fbbf24', 'font-weight': 'bold'}">
        {{ student.gpa }} / 4.0
      </span>
    </p>
    <p class="info-row">
      <span class="info-label">Enrolled:</span>
      <span class="info-val">{{ student.enrolledDate | date:'mediumDate' }}</span>
    </p>

    <div class="course-chips" *ngIf="student.courses && student.courses.length > 0">
      <span class="chip" *ngFor="let course of student.courses">{{ course }}</span>
    </div>
  </div>

  <div class="card-footer">
    <button class="btn btn-secondary btn-sm" (click)="onSelect()">Select Student</button>
  </div>
</div>
